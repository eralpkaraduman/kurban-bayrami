    <hr/>
    <h2>Objective:</h2>
    <p>
        Bring sheeps to pit in the leftmost screen.
        Bring as much as you can, until you get bored.
        Game is incomplete.
    </p>
    <h2>Controls:</h2>
    <ul>
        <li>
            <strong>Arrow Keys: </strong>
            Move
        </li>
        <li>
            <strong>X: </strong>
            Jump
        </li>
        <li>
            <strong>Hold C Near Sheep: </strong>
            Carry Sheep
        </li>
        <li>
            <strong>Release C: </strong>
            Release Sheep
        </li>

    </ul>
